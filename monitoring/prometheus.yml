global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # AI Trading Core (FastAPI) — runs on the host
  - job_name: ai-trading-core
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # ERP service (Express) — runs on the host
  - job_name: ai-trading-erp
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:5001"]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
