<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Office · Neural Constellation</title>
<style>
  :root { --bg:#02040a; --ink:#dce6f5; --muted:#5c7a9c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background: radial-gradient(120% 90% at 50% -10%, rgba(37,99,235,.10), transparent 55%), var(--bg);
    color:var(--ink); font-family: ui-monospace, "SF Mono", Menlo, monospace;
    overflow:hidden; height:100vh;
  }
  .hud { position:fixed; left:24px; top:20px; z-index:5; }
  .hud h1 { font-size:13px; letter-spacing:.18em; font-weight:800; }
  .hud p { font-size:10px; color:var(--muted); margin-top:4px; letter-spacing:.05em; }
  .legend { position:fixed; right:24px; top:20px; z-index:5; text-align:right; font-size:10px; color:var(--muted); line-height:1.7; }
  .legend b { color:var(--ink); }
  svg { width:100vw; height:100vh; display:block; }
  .edge { fill:none; stroke-width:1; opacity:.28; }
  .node-label { font-size:13px; font-weight:700; fill:var(--ink); }
  .node-sub { font-size:9.5px; fill:var(--muted); }
  .node-card { rx:9; }
  .orb { filter:url(#glow); }
  @keyframes breathe { 0%,100%{opacity:.55; r:7} 50%{opacity:1; r:9} }
</style>
</head>
<body>
  <div class="hud">
    <h1>AI TRADING OFFICE</h1>
    <p>Neural Constellation · ทีม AI ทำงานเชื่อมกันแบบมีชีวิต</p>
  </div>
  <div class="legend">
    <div><b>●</b> active &nbsp; <b style="color:#fbbf24">●</b> processing &nbsp; <b style="color:#ef4444">●</b> risk</div>
    <div>เส้น = สายสัญญาณ · จุดวิ่ง = signal flow</div>
  </div>
  <svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="floor" cx="50%" cy="42%" r="60%">
        <stop offset="0%" stop-color="rgba(37,99,235,.10)"/><stop offset="100%" stop-color="transparent"/>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="1200" height="700" fill="url(#floor)"/>
    <g id="grid" stroke="rgba(255,255,255,.035)" stroke-width="1"></g>
    <g id="edges"></g>
    <g id="pulses"></g>
    <g id="nodes"></g>
  </svg>

<script>
const NODES = [
  { id:"ceo",   name:"CEO Agent",  sub:"ผู้บัญชาการ",       x:600, y:350, c:"#34d399", icon:"★", hub:true },
  { id:"report",name:"Report AI",  sub:"ฝ่ายเขียนรายงาน",   x:600, y:120, c:"#34d399", icon:"▤" },
  { id:"chart", name:"Chart AI",   sub:"วิเคราะห์กราฟ",     x:885, y:195, c:"#34d399", icon:"▦" },
  { id:"audit", name:"Audit AI",   sub:"ฝ่ายตรวจสอบ",       x:1000,y:360, c:"#34d399", icon:"⌕" },
  { id:"ea",    name:"EA Bot",     sub:"ฝ่ายอัลกอริทึม",    x:875, y:535, c:"#818cf8", icon:"⬡", proc:true },
  { id:"risk",  name:"Risk AI",    sub:"ควบคุมความเสี่ยง",  x:600, y:600, c:"#ef4444", icon:"⚠", risk:true },
  { id:"alert", name:"Alert AI",   sub:"แจ้งเตือนภัยพอร์ต", x:325, y:535, c:"#fbbf24", icon:"◔", proc:true },
  { id:"strat", name:"Strategy AI",sub:"กลยุทธ์การลงทุน",   x:200, y:360, c:"#fbbf24", icon:"◎", proc:true },
  { id:"fin",   name:"Finance AI", sub:"ฝ่ายการเงิน ERP",   x:315, y:195, c:"#34d399", icon:"$" },
];
const EDGES = [
  ["ceo","report"],["ceo","chart"],["ceo","audit"],["ceo","ea"],
  ["ceo","risk"],["ceo","alert"],["ceo","strat"],["ceo","fin"],
  ["strat","risk"],["risk","ea"],["chart","strat"],["fin","audit"],["ea","report"],
];
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
const NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

// grid
const grid=document.getElementById("grid");
for(let x=0;x<=1200;x+=48) grid.appendChild(el("line",{x1:x,y1:0,x2:x,y2:700}));
for(let y=0;y<=700;y+=48) grid.appendChild(el("line",{x1:0,y1:y,x2:1200,y2:y}));

// edges (curved) + traveling pulses
const edgesG=document.getElementById("edges"), pulsesG=document.getElementById("pulses");
EDGES.forEach(([a,b],i)=>{
  const A=byId[a],B=byId[b];
  const mx=(A.x+B.x)/2, my=(A.y+B.y)/2 - 36;
  const d=`M ${A.x} ${A.y} Q ${mx} ${my} ${B.x} ${B.y}`;
  const col = B.risk||A.risk ? "#ef4444" : (B.proc||A.proc ? "#fbbf24" : "#34d399");
  const p=el("path",{d,class:"edge",stroke:col,id:`e${i}`});
  edgesG.appendChild(p);
  // 1-2 pulses per edge
  const n = a==="ceo" ? 1 : 1;
  for(let k=0;k<n;k++){
    const dot=el("circle",{r:2.6,fill:col,filter:"url(#glow)"});
    const m=el("animateMotion",{dur:(2.6+Math.random()*1.8)+"s",begin:(Math.random()*2)+"s",repeatCount:"indefinite"});
    m.appendChild(el("mpath",{href:`#e${i}`}));
    dot.appendChild(m); pulsesG.appendChild(dot);
  }
});

// nodes
const nodesG=document.getElementById("nodes");
NODES.forEach(n=>{
  const g=el("g",{transform:`translate(${n.x},${n.y})`});
  // orb
  const orb=el("circle",{r:n.hub?11:7.5,cx:0,cy:0,fill:n.c,class:"orb"});
  orb.style.animation=`breathe ${2.6+Math.random()*1.5}s ease-in-out infinite`;
  g.appendChild(el("circle",{r:n.hub?22:16,cx:0,cy:0,fill:"none",stroke:n.c,"stroke-opacity":.25}));
  g.appendChild(orb);
  // card
  const w = Math.max(120, n.name.length*9 + 34), h=36, cardX=18, cardY=-h/2;
  const card=el("rect",{x:cardX,y:cardY,width:w,height:h,rx:9,fill:"rgba(7,11,20,.86)",stroke:n.c,"stroke-opacity":.5});
  g.appendChild(card);
  g.appendChild(el("text",{x:cardX+12,y:-1,class:"node-label"})).textContent = n.icon+"  "+n.name;
  g.appendChild(el("text",{x:cardX+12,y:12,class:"node-sub"})).textContent = n.sub;
  // status dot on card
  const sd=el("circle",{cx:cardX+w-12,cy:-h/2+12,r:3,fill:n.c,filter:"url(#glow)"});
  sd.style.animation="breathe 1.8s ease-in-out infinite";
  g.appendChild(sd);
  nodesG.appendChild(g);
});
</script>
</body>
</html>
